[tool.poetry]
name = "ots-citrap-report"
description = "Reports: view, upload, and manage EUD-submitted reports on OpenTAKServer"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://github.com/codebase375/OTS-Citrap-Report"
documentation = "https://github.com/codebase375/OTS-Citrap-Report#readme"
version = "1.0.0"
packages = [{ include = "ots_citrap_report" }]
include = ["ots_citrap_report/ui/**/*"]

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.plugins."opentakserver.plugin"]
ots_citrap_report = "ots_citrap_report.app:OtsCitrapReport"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
